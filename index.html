
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OG | Music Player</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
    }
    .player {
      width: min(360px, 80%);
      padding: 32px;
      text-align: center;
      border: 1px solid #30363d;
      border-radius: 18px;
      background: #161b22;
    }
    h1 { letter-spacing: 3px; }
    p { color: #8b949e; }
    audio { width: 100%; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="player">
    <h1>♫ OG</h1>
    <p>A little music while you explore.</p>
    <audio controls preload="metadata">
      <source src="./OG.mp3" type="audio/mpeg">
      Your browser does not support audio.
    </audio>
  </main>
</body>
</html>
